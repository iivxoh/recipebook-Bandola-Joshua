{% extends 'base.html' %}

{% block body %}
<ul>
    {% for recipe in recipes %}
    <h2>{{recipe.name}}</h2>
        {% for ingredient in recipe.ingredients.all %}
        <li>{{ingredient.ingredient.name}}: {{ingredient.quantity}}</li>
        {% endfor %}
    <p></p>
    <a href="{{ recipe.get_absolute_url }}">Learn the Recipe</a>
    {% endfor %}
</ul>
{% endblock %}
