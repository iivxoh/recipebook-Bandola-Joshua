{% extends 'base.html' %}

{% block body %}
<ul>
    {% for recipe in recipes %}
    <h2>{{recipe.name}}</h2>
        {% for ingredient in recipe.ingredients %}
        <li>{{ingredient.name}}: {{ingredient.quantity}}</li>
        {% endfor %}
    <p></p>
    <a href="{{recipe.link}}">Learn the Recipe</a>
    {% endfor %}
</ul>
{% endblock %}
